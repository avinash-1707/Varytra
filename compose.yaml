services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: varytra
      POSTGRES_USER: varytra
      POSTGRES_PASSWORD: varytra
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: varytra
      MINIO_ROOT_PASSWORD: varytra-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
  postgres-data:
