services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: varytra
      POSTGRES_USER: varytra
      POSTGRES_PASSWORD: varytra
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  postgres-data:
